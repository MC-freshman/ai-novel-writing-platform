name: 自动回归

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:regression
      - run: npm run lint
      - run: npm run scan:privacy
      - run: npm run test:ui-plan
      - run: npm run test:ui-novel-network
      - run: npm run test:ui-visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-evidence
          path: .test-runs/
          include-hidden-files: true
          if-no-files-found: error
