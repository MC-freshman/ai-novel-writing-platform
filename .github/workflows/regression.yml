name: 自动回归

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # test:regression 已包含构建检查、核心回归、Agent 平台回归、导出回归和 UI 按钮审计。
      # 500 万字性能（test:long-project）与 UI 视觉回归（test:ui-visual）耗时较长，发布前手动执行。
      - run: npm run test:regression
